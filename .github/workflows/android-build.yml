# B-Klasa Hero — budowa APK debug na każdym PR (weryfikacja, że Gradle/NDK żyją).
# Uruchamiany na runnerze x86_64, gdzie AAPT2 i NDK działają natywnie.
# SPDX-License-Identifier: GPL-3.0-or-later
name: android-build

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Konfiguracja Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalacja platform + build-tools + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "platform-tools" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/.cxx
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts', 'android/app/build.gradle.kts', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Kompilacja APK debug
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleDebug

      - name: Artefakt: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: bkh-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14