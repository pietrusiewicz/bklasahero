# B-Klasa Hero — release: build APK release, podpisanie, publikacja GitHub Release.
# Wymaga sekretów (patrz README.md → "Sekrety CI").
# SPDX-License-Identifier: GPL-3.0-or-later
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Semver, np. 0.2.0'
        required: true
        default: '0.1.0'
      versionCode:
        description: 'Monotoniczny numer (int), np. 2'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Konfiguracja Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalacja platform + build-tools + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "platform-tools" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
            android/app/.cxx
          key: gradle-android-release-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-android-release-${{ runner.os }}-

      - name: Ustalenie wersji
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION_NAME=${{ github.event.inputs.versionName }}" >> "$GITHUB_OUTPUT"
            echo "VERSION_CODE=${{ github.event.inputs.versionCode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release (unsigned)
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.ver.outputs.VERSION_CODE }}"

      - name: Odtworzenie klucza i podpisanie
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          # AGP emituje app-release-unsigned.apk (bo release nie ma signingConfig).
          if [[ ! -f "$UNSIGNED" ]]; then
            UNSIGNED=android/app/build/outputs/apk/release/app-release.apk
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
          ZALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$ZALIGN" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out android/app/build/outputs/apk/release/app-release.apk \
            /tmp/aligned.apk
          "$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Publikacja GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true