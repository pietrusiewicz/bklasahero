# B-Klasa Hero — release: pełen build APK release + APK podpisany + publikacja.
# Wymaga sekretów (patrz README.md → "Sekrety CI").
# SPDX-License-Identifier: GPL-3.0-or-later
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Numer wersji (np. 1, 2, 3...)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
               ~/.gradle/caches
               android/.gradle
            build
            android/app/.cxx
          key: gradle-android-release-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts', 'android/app/build.gradle.kts') }}

      - name: Odtworzenie klucza z sekretu
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release.jks
          cat > android/key.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Wersja z taga
        if: startsWith(github.ref, 'refs/tags/v')
        id: ver
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Wersja z workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: ver
        run: |
          echo "VERSION_NAME=${{ github.event.inputs.versionName }}"
          echo "VERSION_CODE=${{ github.event.inputs.versionCode }}"

      - name: Build release
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.ver.outputs.VERSION_CODE }}"

      - name: Weryfikacja podpisu
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name 'apksigner' | head -1)
          $APKSIGNER verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Publikacja GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true